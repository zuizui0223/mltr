name: Exposito experimental rainfall decision-value audit

on:
  pull_request:
    paths:
      - "scripts/audit_exposito_rainfall_decision.py"
      - "tests/test_exposito_rainfall_decision.py"
      - "docs/exposito_rainfall_decision_protocol_2026-11-22.md"
      - ".github/workflows/exposito-rainfall-decision.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rainfall-policy-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy for test-only source-free analysis
        run: python -m pip install numpy==2.3.5
      - name: Verify policy-value contracts without original data
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -m unittest discover -s tests -p "test_exposito_rainfall_decision.py" -v

  rainfall-policy-public-source:
    runs-on: ubuntu-latest
    needs: rainfall-policy-synthetic
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source parsing and regression dependencies
        run: python -m pip install numpy==2.3.5 openpyxl==3.1.5 rdata==1.1.0
      - name: Fetch EXACT published original files (not committed)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/exposito-original"
          curl -fLsS --retry 2 --retry-delay 2 --connect-timeout 30 --max-time 240 \
            -o "$RUNNER_TEMP/exposito-original/S_DATASETS.xlsx" \
            "https://ndownloader.figshare.com/files/17131214"
          curl -fLsS --retry 2 --retry-delay 2 --connect-timeout 30 --max-time 240 \
            -o "$RUNNER_TEMP/exposito-original/ibs1001g.rda" \
            "https://raw.githubusercontent.com/MoisesExpositoAlonso/dryAR/ddf703c91a01a990b8041f0aea9c94de119cd60b/data-cleaning/ibs1001g.rda"
      - name: Enforce original source hashes and reconstruct 514-accession cohort
        run: |
          python scripts/prepare_exposito_genomic_fitness.py \
            --workbook "$RUNNER_TEMP/exposito-original/S_DATASETS.xlsx" \
            --ibs "$RUNNER_TEMP/exposito-original/ibs1001g.rda" \
            --out-npz "$RUNNER_TEMP/exposito-original/prepared.npz" \
            --out-audit "$RUNNER_TEMP/exposito-original/source_audit.json"
      - name: Evaluate frozen M0/M1 rainfall allocations on held-out accessions
        run: |
          mkdir -p artifacts
          python scripts/audit_exposito_rainfall_decision.py \
            --prepared "$RUNNER_TEMP/exposito-original/prepared.npz" \
            --source-audit "$RUNNER_TEMP/exposito-original/source_audit.json" \
            --protocol docs/exposito_rainfall_decision_protocol_2026-11-22.md \
            --out artifacts/exposito_rainfall_decision_2026-11-22.json
      - name: Print AGGREGATE-ONLY result as machine-verifiable log
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("artifacts/exposito_rainfall_decision_2026-11-22.json")
          value=json.loads(path.read_text())
          if value["primary"]["n_accessions"] != 514:
              raise SystemExit("source cohort changed")
          print("MLTR_POLICY_AGGREGATE_JSON="+json.dumps(value,sort_keys=True,separators=(",",":")))
          PY
      - name: Upload aggregate-only policy evidence (not source files)
        uses: actions/upload-artifact@v4
        with:
          name: exposito-rainfall-choice-aggregate
          path: artifacts/exposito_rainfall_decision_2026-11-22.json
          if-no-files-found: error
          retention-days: 60
