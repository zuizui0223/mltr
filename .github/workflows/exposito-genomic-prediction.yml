name: Exposito genomic prediction tests

on:
  pull_request:
    paths:
      - "scripts/prepare_exposito_genomic_fitness.py"
      - "scripts/analyze_exposito_genomic_fitness.py"
      - "scripts/replay_exposito_genomic_prediction.py"
      - "tests/test_exposito_*.py"
      - "docs/exposito_genomic_prediction_protocol_2026-11-22.md"
      - ".github/workflows/exposito-genomic-prediction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genomic-prediction-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated empirical dependencies
        run: python -m pip install numpy openpyxl rdata
      - name: Test source alignment and nested prediction without source downloads
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -m unittest discover -s tests -p "test_exposito_*.py" -v
