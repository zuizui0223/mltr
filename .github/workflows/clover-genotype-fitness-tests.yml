name: Clover genotype-fitness population holdout tests

on:
  pull_request:
    paths:
      - "scripts/analyze_clover_haploblock_fitness.py"
      - "tests/test_clover_haploblock_fitness.py"
      - ".github/workflows/clover-genotype-fitness-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population-holdout-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated empirical-only dependencies
        run: python -m pip install numpy scikit-learn
      - name: Test phenotype/genotype source gates and out-of-population CV
        run: python -m unittest discover -s tests -p "test_clover_haploblock_fitness.py" -v
